[item-name]
robo-grid-tool=Robo grid tool

[item-description]
robo-grid-tool=Drag: grow the robot network over the area, on the grid (roboport ghosts edge-first, poles to power them).\nShift-drag over roboports: remove the ones others now cover completely (as roboports gain quality).

[shortcut-name]
robo-grid-tool=Robo grid tool

[mod-setting-name]
robo-grid-roboport=Roboport to place
robo-grid-pole=Pole for the power chain
robo-grid-bots=Construction robots each new roboport requests
robo-grid-max-cells=Furthest grid cells from the network to grow toward
robo-grid-enemy-range=Keep away from enemies (tiles)
robo-grid-ignore-types=Built things that don't pull the network
robo-grid-overlap=Grid overlap (tiles)
robo-grid-request-minutes=Give up on a request after (minutes)
robo-grid-remove-empty=Tidy: remove grid roboports that cover nothing
robo-grid-tidy-minutes=Auto-tidy re-checks every (minutes)

[mod-setting-description]
robo-grid-roboport=Entity name of the roboport the grid uses (e.g. roboport, or a modded one). Its logistic area sets the grid spacing.
robo-grid-pole=Entity name of the pole used to bring power to new roboports.
robo-grid-bots=Each new roboport asks the network for this many construction robots (0: none).
robo-grid-max-cells=A request further than this many grid cells from the network is ignored.
robo-grid-enemy-range=No roboport is placed, and no growth is started, within this many tiles of an enemy nest or worm (0: no check).
robo-grid-ignore-types=Entity types (comma separated) that never make the network grow toward them, and that a roboport may cover and still count as covering nothing. Default: turrets, land mines and vehicles.
robo-grid-overlap=How many tiles closer than the logistic diameter roboports are placed, so neighbouring areas overlap and a roboport nudged around an obstacle still joins the network.
robo-grid-request-minutes=A build the network can't reach yet is retried for this long.
robo-grid-remove-empty=Auto-tidy (and the tool's shift-drag) also removes roboports this mod built whose area holds nothing but poles, roboports and the ignored types, from the network's edge in. Your own roboports are never removed this way.
robo-grid-tidy-minutes=While auto-tidy is on: how often it looks over everything this mod built (empty roboports, leftover pole chains).

[robo-grid]
auto-tooltip=[font=default-bold]Robo Grid: auto-grow[/font]\nWhile lit: building (or placing a ghost) outside the robot network grows the network toward it, on the grid.
tidy-tooltip=[font=default-bold]Robo Grid: auto-tidy[/font]\nWhile lit: roboports made redundant by an upgraded roboport are removed by bots.
